server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            server:
                webflux:
                    routes:
                        - id: customer-service-route
                          uri: lb://customer-service
                          predicates:
                              - Path=/api/v1/customers/**
                          filters:
                            - AddResponseHeader=X-System-Name, Api-Gateway-System

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/